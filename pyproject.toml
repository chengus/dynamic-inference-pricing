[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-pricing-simulator"
version = "0.1.0"
description = "Synthetic discrete-event auction pricing simulator for LLM inference capacity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.8"]

[project.scripts]
auction-sim = "auction_sim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"auction_sim.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep checks reproducible instead of inheriting a developer's parent config.
select = ["E4", "E7", "E9", "F"]
