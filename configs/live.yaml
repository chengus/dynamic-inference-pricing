# Deliberately congested synthetic demo so standing demand is visible.
# Both token-depth views use this one market and one bundled per-token rate.
name: synthetic-live-orderbook
horizon_s: 600
economics: {marginal_cost_per_token: 0.001}
server: {t0_s: 0.005, k_s: 0.0005, prefill_s_per_token: 0.00002, prefill_chunk_tokens: 256, max_batch_size: 8, max_kv_tokens: 16384}
demand:
  rate_rps: 10.0
  interactive_fraction: 0.25
  diurnal_amplitude: 0.25
  output_cap_tokens: 512
  reservation_slack: 1.25
  agent_rate_rps: 0.5
  agent_max_wait_s: 30
seeds:
  calibration: [0, 1]
  evaluation: [100, 101]
slo: {fill_rate: 0.95}
oracle: {enabled: false}
candidate_grid:
  uniform_auction: {reserve_per_token: [0.001]}
  first_price_hybrid: {reserve_per_token: [0.001]}
  flat_price: {price_per_token: [0.002], reserve_per_token: [0.001]}
  static_tiers: {base_price_per_token: [0.002], reserve_per_token: [0.001], standard_wait_s: [10], flex_wait_s: [30]}
  time_of_day_grid:
    prices_per_token: [[0.002, 0.004]]
    edges_s: [[0, 300, 86400]]
    reserve_per_token: [0.001]
  utilization_controller:
    initial_price_per_token: [0.002]
    reserve_per_token: [0.001]
    target_utilization: [0.8]
    update_interval_s: [10]
    gain: [0.1]
